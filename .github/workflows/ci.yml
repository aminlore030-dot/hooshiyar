name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        # The generated client ships without type declarations; type-checking
        # needs them, so regenerate before running tsc.
        run: bunx prisma generate
        env:
          DATABASE_URL: file:db/custom.db

      - name: Run ESLint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit
